<div class="login-wrap">
  <form class="login-card card" (ngSubmit)="submit()" #f="ngForm">
    <div class="login-brand">
      <span class="script">Chloe G's</span>
      <span class="login-admin-label">Admin</span>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        name="email"
        [(ngModel)]="email"
        required
        autocomplete="username"
      />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        name="password"
        [(ngModel)]="password"
        required
        autocomplete="current-password"
      />
    </div>

    @if (timedOut()) {
      <p class="login-timeout-notice">You were signed out due to inactivity.</p>
    }

    @if (error()) {
      <p class="field-error login-error">{{ error() }}</p>
    }

    <button type="submit" class="btn btn-primary login-btn" [disabled]="loading()">
      {{ loading() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
